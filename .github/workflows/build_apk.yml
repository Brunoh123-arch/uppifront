name: "Build Uppi Mobile APKs (32-bit e 64-bit)"

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependencias
        run: |
          cd frontend
          flutter pub get

      - name: Analise e Testes
        run: |
          cd frontend
          flutter analyze
          flutter test

      - name: Compilar APKs (32-bit armeabi-v7a e 64-bit arm64-v8a)
        run: |
          cd frontend
          flutter build apk --split-per-abi --release

      - name: Disponibilizar APK 32-bit
        uses: actions/upload-artifact@v4
        with:
          name: Uppi-32bit-armeabi-v7a
          path: frontend/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Disponibilizar APK 64-bit
        uses: actions/upload-artifact@v4
        with:
          name: Uppi-64bit-arm64-v8a
          path: frontend/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
